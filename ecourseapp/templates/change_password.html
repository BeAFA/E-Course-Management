{%extends 'layout/base.html'%}
{% block css %}
<link href="/static/css/form.css" rel="stylesheet">
{% endblock %}
{%block content%}
<main class="create-form-container">
    <div class="form-card">
        <div class="form-header">
            <h1>Đổi mật khẩu</h1>
        </div>

        {% if err_msg %}
        <div class="alert-error">
            {{ err_msg }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('update_password') }}" class="form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" value="{{ current_user.email }}" disabled>
            </div>

            <div class="form-group">
                <label for="oldpassword">Mật khẩu cũ<span class="required">*</span></label>
                <input type="password" id="oldpassword" minlength="8" name="oldpassword"
                       placeholder="12345678">
            </div>

            <div class="form-group">
                <label for="newpassword">Mật khẩu<span class="required">*</span></label>
                <input type="password" id="newpassword" minlength="8" name="newpassword"
                       placeholder="abcdefgh">
            </div>

            <div class="form-group">
                <label for="confirm">Xác nhận lại mật khẩu<span class="required">*</span></label>
                <input type="password" id="confirm" minlength="8" name="confirm"
                       placeholder="abcdefgh">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    Đổi mật khẩu
                </button>
                <a href="{{ url_for('profile_my_user') }}" class="btn-cancel">Hủy</a>
            </div>

        </form>
    </div>
</main>
{%endblock%}
