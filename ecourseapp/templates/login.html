{%extends 'layout/base.html'%}
{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
{% endblock %}
{%block content%}
<main class="create-form-container">
    <div class="form-card">
        <div class="form-header">
            <h1>Đăng nhập</h1>
        </div>

        {% if err_msg %}
        <div class="alert-error">
            {{ err_msg }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login_my_user') }}" class="form" enctype="multipart/form-data">
            <div class="form-group">
                <label for="email">Email<span class="required">*</span></label>
                <input type="text" id="email" name="email" placeholder="abc@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu<span class="required">*</span></label>
                <input type="password" id="password" name="password"
                       placeholder="12345678">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    Đăng nhập
                </button>
                <a href="{{ url_for('register_new_user') }}" class="btn-cancel">Đăng ký</a>
            </div>
        </form>
    </div>
</main>
{%endblock%}
