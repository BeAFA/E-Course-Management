{%extends 'layout/base.html'%}
{%block content%}
<link rel="stylesheet" href="/static/css/form.css">
<body>
<a href="/chapters/{{ chapter_id }}/lessons/add" class="btn btn-primary">
    <i class="fa-solid fa-user-plus"></i> Tạo bài giảng
</a>
{% if lessons %}
{% for lesson in lessons %}
<a href="/lessons/{{ lesson.id }}">
    <div class="card" style="width:400px">
        <div class="card-body">
            <h4 class="card-title">{{ lesson.title }}</h4>
        </div>
        <div class="card-body">
            <h4 class="card-title">{{ lesson.article|safe }}</h4>
        </div>
    </div>
</a>
{% endfor %}
{% else %}
<h2>Chưa có bài giảng</h2>
{% endif %}
</body>
{%endblock%}
