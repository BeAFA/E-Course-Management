{% extends 'layout/base.html' %}
{% block content %}
<link rel="stylesheet" href="/static/css/form.css">

<div class="container mt-3">
    <div class="d-flex gap-2 mb-3">
        <a href="/chapters/{{ chapter_id }}/lessons/add" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i> Tạo bài giảng
        </a>
        <a href="/chapters/{{ chapter_id }}/tests" class="btn btn-success">
            <i class="fa-solid fa-file-lines"></i> Bài thi
        </a>
    </div>

    {% if lessons %}
        {% for lesson in lessons %}
        <a href="/lessons/{{ lesson.id }}" class="text-decoration-none">
            <div class="card mb-3" style="width:400px">
                <div class="card-body">
                    <h4 class="card-title">{{ lesson.title }}</h4>
                </div>
                <div class="card-body">
                    <h5 class="card-subtitle text-muted">{{ lesson.article|safe }}</h5>
                </div>
            </div>
        </a>
        {% endfor %}
    {% else %}
        <h2>Chưa có bài giảng</h2>
    {% endif %}
</div>
{% endblock %}
