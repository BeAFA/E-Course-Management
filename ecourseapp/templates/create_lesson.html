{%extends 'layout/base.html'%}
{%block content%}
<link rel="stylesheet" href="{{ url_for('static', filename='css/create_course.css') }}">
<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>
<script src="/static/js/ckeditor.js"></script>
<body>
{% if err_msg %}
<div class="alert alert-danger alert-dismissible fade show" role="alert">
    <strong>Lỗi:</strong> {{ err_msg }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
{% endif %}
<main class="create-course-container">
    <div class="form-card">
        <div class="form-header">
            <h1>Tạo bài giảng mới</h1>
        </div>
        <form action="/chapters/{{ chapter_id }}/lessons/add" method="POST" class="course-form"
              enctype="multipart/form-data">
            <div class="form-group">
                <label for="title">Tên bài giảng <span class="required">*</span></label>
                <input type="text" id="title" name="title" placeholder="Ví dụ: Lập trình Python" required>
            </div>
            <div class="form-group">
                <label for="video">Video bài giảng (nếu có)</label>
                <input type="file" id="video" name="video">
            </div>
            <div class="form-group">
                <label for="img">Ảnh bài giảng</label>
                <input type="file" id="img" name="img">
            </div>
            <div class="form-group">
                <label for="article">Bài viết (nếu có)</label>
                <textarea class="ckeditor" id="article" name="article"></textarea>
            </div>
            <div class="form-actions">
                <a href="/chapters/{{chapter_id}}/lessons" class="btn-cancel">Hủy bỏ</a>
                <button type="submit" class="btn-submit">
                    Tạo bài học
                </button>
            </div>
        </form>
    </div>
</main>
</body>
{%endblock%}
