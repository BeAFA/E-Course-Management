{%extends 'layout/base.html'%}
{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
{% endblock %}
{%block content%}
<main class="create-form-container">
    <div class="form-card">
        <div class="form-header">
            <h1>Tạo bài giảng mới</h1>
        </div>

        {% if err_msg %}
        <div class="alert-error">
            {{ err_msg }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('register_new_user') }}" class="form" enctype="multipart/form-data">
            <div class="form-group">
                <label for="title">Tên bài giảng <span class="required">*</span></label>
                <input type="text" id="title" name="title" placeholder="Ví dụ: Lập trình Python" required>
            </div>

            <div class="form-group">
                <label for="video">Video bài giảng (nếu có)</label>
                <input type="file" id="video" name="video">
            </div>

            <div class="form-group">
                <label for="img">Ảnh bài giảng</label>
                <input type="file" id="img" name="img">
            </div>

            <div class="form-group">
                <label for="article">Bài viết (nếu có)</label>
                <textarea class="ckeditor" id="article" name="article"></textarea>
            </div>

            <div class="form-actions">
                <a href="{{url_for('lessons', chapter_id=chapter_id)}}" class="btn-cancel">Hủy bỏ</a>
                <button type="submit" class="btn-submit">
                    Tạo bài học
                </button>
            </div>
        </form>
    </div>
</main>
{%endblock%}
{% block js %}
<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>
<script src="/static/js/ckeditor.js"></script>
{% endblock %}
