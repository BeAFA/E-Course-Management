{% block css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock %}
<header>
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <div class="container-fluid">
            <a href="{{ url_for('home')}}" class="navbar-brand"><img
                    src="/static/img/logo.png"
                    width="20%" height="20%" alt="E-Course"> E-Course</a>
            <div class="collapse navbar-collapse flex-row-reverse" id="mynavbar">
                {% if current_user.is_authenticated %}
                <a href="{{ url_for('profile_my_user') }}" class="btn">
                    <button class="btn btn-outline-light">
                        Chào {{ current_user.name }}!
                    </button>
                </a>
                {% if current_user.role.value == 'TEACHER' %}
                <a href="{{ url_for('get_my_course') }}" class="btn">
                    <button class="btn btn-outline-light mr">
                        <i class="fa-solid fa-user-plus"></i> Danh sách Khóa học của tôi
                    </button>
                </a>
                {% endif %}
                <a href="{{ url_for('logout_my_user') }}" class="btn">
                    <button class="btn btn-outline-light mr">
                        <img src="https://cdn-icons-png.flaticon.com/128/1286/1286907.png" width="25">
                        <i class="fa-solid fa-user-plus"></i> Đăng xuất
                    </button>
                </a>
                {% else %}
                <a type="button" href="{{ url_for('login_my_user') }}">
                    <button class="btn btn-outline-light">
                        <i class="fa-solid fa-user-plus"></i> Đăng nhập
                    </button>
                </a>
                {% endif %}
            </div>
        </div>
    </nav>
</header>
{% block js %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
