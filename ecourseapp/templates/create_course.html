{% extends 'layout/base.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/create_course.css') }}">
{% endblock %}

{% block content %}
<main class="create-course-container">
    <div class="form-card">
        <div class="form-header">
            <h1>Đăng khóa học mới</h1>
            <p>Chia sẻ kiến thức của bạn tới cộng đồng học viên</p>
        </div>

        {% if err_msg %}
        <div class="alert-error">
            {{ err_msg }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('create_course') }}" class="course-form">
            <div class="form-group">
                <label for="name">Tên khóa học <span class="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="Ví dụ: Lập trình Python" required>
            </div>

            <div class="form-group">
                <label for="category_id">Danh mục <span class="required">*</span></label>
                <select id="category_id" name="category_id" required>
                    <option value="" disabled selected>-- Chọn danh mục --</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="price">Giá tiền (VNĐ)</label>
                <input type="number" id="price" name="price" min="0" step="1000" placeholder="Ví dụ: 500000 (Để 0 nếu miễn phí)">
            </div>

            <div class="form-group">
                <label for="description">Mô tả khóa học</label>
                <textarea id="description" name="description" rows="6" placeholder="Giới thiệu nội dung, mục tiêu và yêu cầu đầu vào của khóa học..."></textarea>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('home') }}" class="btn-cancel">Hủy bỏ</a>
                <button type="submit" class="btn-submit">
                    Đăng khóa học
                </button>
            </div>
        </form>
    </div>
</main>
{% endblock %}
