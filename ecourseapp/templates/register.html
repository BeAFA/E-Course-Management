{%extends 'layout/base.html'%}
{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
{% endblock %}
{%block content%}
<main class="create-form-container">
    <div class="form-card">
        <div class="form-header">
            <h1>Đăng ký</h1>
        </div>

        {% if err_msg %}
        <div class="alert-error">
            {{ err_msg }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('register_new_user') }}" class="form" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Họ và tên<span class="required">*</span></label>
                <input type="text" id="name" name="name" placeholder="Nguyễn Văn A" required>
            </div>

            <div class="form-group">
                <label for="email">Email<span class="required">*</span></label>
                <input type="text" id="email" name="email" placeholder="abc@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu<span class="required">*</span></label>
                <input type="password" id="password" minlength="8" name="password"
                       placeholder="12345678">
            </div>

            <div class="form-group">
                <label for="confirm">Xác nhận lại mật khẩu<span class="required">*</span></label>
                <input type="password" id="confirm" minlength="8" name="confirm"
                       placeholder="12345678">
            </div>

            <div class="form-group">
                <label for="img">Ảnh đại diện</label>
                <input type="file" id="img" name="img">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    Đăng ký
                </button>
                <a href="{{ url_for('login_my_user') }}" class="btn-cancel">Đăng nhập</a>
            </div>

            <div class="form-actions">
                <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
                    <label for="confirm">Bạn là giảng viên?</label>
                    <button type="submit" class="btn-submit" name="role" value="TEACHER">
                        Đăng ký trở thành giảng viên
                    </button>
                </div>
            </div>
        </form>
    </div>
</main>
{%endblock%}
